name: Daily Invest Bot

on:
  schedule:
    # 避开整点高峰，设置为 UTC 22:35
    # 对应日本时间 07:35 (JST) / 北京时间 06:35 (CST)
    # 算上 GitHub 排队和脚本运行时间，预计日本时间 08:00 左右收到推送
    - cron: '35 22 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    - name: Run script
      env:
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python main.py